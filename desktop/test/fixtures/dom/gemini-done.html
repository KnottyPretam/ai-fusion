<!doctype html>
<html>
  <head>
    <title>…</title>
  </head>
  <body>
    <chat-app id="app-root" class="ng-tns-c1-0">
      <div class="boqOnegoogleliteOgbOneGoogleBar">
        <header class="gb_Ma gb_Wd">
          <div class="gb_Ad gb_Ke">
            <a class="gb_A gb_Ua gb_Ka" role="button" aria-label="Google Account: name">…</a>
          </div>
        </header>
      </div>
      <main class="chat-container">
        <infinite-scroller class="chat-history" data-test-id="chat-history-container">
          <div id="chat-history" class="chat-history-scroll-container">
            <div class="conversation-container message-actions-hover-boundary">
              <user-query class="ng-star-inserted">
                <span class="user-query-container right-align-content">
                  <div class="query-content">
                    <span class="cdk-visually-hidden screen-reader-user-query-label">…</span>
                    <div class="query-text gds-body-l" role="heading">
                      <p class="query-text-line">…</p>
                    </div>
                  </div>
                  <div class="query-actions">
                    <button class="mat-mdc-icon-button" data-test-id="copy-button" aria-label="Copy prompt">
                      <mat-icon class="mat-icon google-symbols" fonticon="content_copy"></mat-icon>
                    </button>
                  </div>
                </span>
              </user-query>
              <model-response class="ng-star-inserted">
                <div class="response-container response-container-with-gpi">
                  <span class="cdk-visually-hidden screen-reader-model-response-label">…</span>
                  <div class="presented-response-container">
                    <div class="response-content">
                      <message-content class="model-response-text">
                        <div class="markdown markdown-main-panel stronger enable-updated-hr-color">
                          <p>…</p>
                          <ul>
                            <li>…</li>
                            <li>…</li>
                          </ul>
                          <code-block class="ng-star-inserted">
                            <div class="code-block">
                              <div class="code-block-decoration header-formatted gds-title-s">
                                <span>…</span>
                                <div class="buttons">
                                  <button class="mat-mdc-icon-button copy-button" aria-label="Copy code">
                                    <mat-icon class="mat-icon google-symbols" fonticon="content_copy"></mat-icon>
                                  </button>
                                </div>
                              </div>
                              <div class="formatted-code-block-internal-container">
                                <div class="animated-opacity">
                                  <pre><code class="code-container formatted" role="text" data-test-id="code-content">…</code></pre>
                                </div>
                              </div>
                            </div>
                          </code-block>
                        </div>
                      </message-content>
                    </div>
                  </div>
                  <message-actions class="ng-star-inserted">
                    <div class="actions-container-v2">
                      <button class="mat-mdc-icon-button" aria-label="Good response">
                        <mat-icon class="mat-icon google-symbols" fonticon="thumb_up"></mat-icon>
                      </button>
                      <button class="mat-mdc-icon-button" aria-label="Bad response">
                        <mat-icon class="mat-icon google-symbols" fonticon="thumb_down"></mat-icon>
                      </button>
                      <button class="mat-mdc-icon-button" data-test-id="copy-button" aria-label="Copy">
                        <mat-icon class="mat-icon google-symbols" fonticon="content_copy"></mat-icon>
                      </button>
                    </div>
                  </message-actions>
                </div>
              </model-response>
            </div>
          </div>
        </infinite-scroller>
        <input-container class="input-area-container">
          <input-area-v2 class="input-area">
            <div class="text-input-field">
              <rich-textarea class="text-input-field_textarea">
                <div class="ql-editor textarea new-input-ui" contenteditable="true" role="textbox" aria-label="Enter a prompt for Gemini">
                  <p>…</p>
                </div>
                <div class="ql-clipboard" contenteditable="true"></div>
              </rich-textarea>
              <div class="trailing-actions-wrapper">
                <div class="send-button-container visible">
                  <button class="mat-mdc-icon-button send-button submit" aria-label="Send message">
                    <mat-icon class="mat-icon google-symbols" fonticon="arrow_upward"></mat-icon>
                  </button>
                </div>
              </div>
            </div>
          </input-area-v2>
        </input-container>
      </main>
    </chat-app>
  </body>
</html>
